<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contests">
<meta name="theme-color" content="#0d0d0f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<title>Veille DJ contests – Schranz</title>
<style>
:root{--bg:#f4f3f1;--card:#fff;--fg:#141414;--mute:#6b6b6b;--line:#e2e0dc;--acc:#d9122b;--acc-soft:#fde7ea;--ok:#1d7a46}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0f;--card:#18181b;--fg:#f2f2f2;--mute:#9a9aa2;--line:#2a2a2f;--acc:#ff3b52;--acc-soft:#3a1218;--ok:#4cc985}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0) + 14px) 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;text-transform:uppercase}
h1 span{color:var(--acc)}
.maj{color:var(--mute);font-size:13px;margin:4px 0 10px}
.filtres{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filtres::-webkit-scrollbar{display:none}
.filtres button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);
  padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600}
.filtres button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:12px 16px 40px;max-width:680px;margin:auto}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;position:relative}
.c.fav{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
.top{display:flex;gap:10px;align-items:flex-start}
.score{flex:none;min-width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  font-weight:800;font-size:15px;background:var(--acc-soft);color:var(--acc)}
.c a{color:var(--fg);text-decoration:none;font-weight:650;font-size:16px;line-height:1.3;display:block}
.meta{color:var(--mute);font-size:12.5px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tags span{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--mute)}
.tags span.s{background:var(--acc);color:#fff;font-weight:700}
.act{display:flex;gap:8px;margin-top:12px}
.act button{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);padding:9px;border-radius:10px;font-size:14px}
.act button.on{color:var(--acc);border-color:var(--acc)}
.vide{text-align:center;color:var(--mute);padding:50px 20px;line-height:1.5}
.nouveau{position:absolute;top:-7px;right:12px;background:var(--ok);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.04em}
</style>
</head>
<body>
<header>
  <h1>DJ Contests <span>Schranz</span></h1>
  <div class="maj">Mis à jour le 25/11/2026 à 06:52</div>
  <div class="filtres" id="filtres">
    <button data-f="tous" class="on">Tous</button>
    <button data-f="schranz">Schranz</button>
    <button data-f="paris">Paris / IDF</button>
    <button data-f="fav">★ Favoris</button>
    <button data-f="masques">Masqués</button>
  </div>
</header>
<main id="liste"></main>
<script>
const DATA = [{"t": "Winter Music Conference 2027 Returns to Downtown Miami", "u": "https://hoodline.com/2026/11/winter-music-conference-returns-to-downtown-miami-with-ai-panels-dj-contest/", "s": 7, "k": ["contest", "dj-contest", "hard techno", "techno"], "src": "DuckDuckGo", "d": "2026-11-25"}, {"t": "Silent Techno Events - Facebook", "u": "https://www.facebook.com/Silent.Techno/", "s": 10, "k": ["contest", "dj contest", "hard techno", "schranz", "techno"], "src": "DuckDuckGo", "d": "2026-11-24"}, {"t": "XouTempo | MY FRICTION DJ CONTEST IS OUT NOW ! ⚡️ STREAM AND ...", "u": "https://www.instagram.com/reel/DfP202vtcCu/", "s": 10, "k": ["contest", "dj contest", "hard techno", "hardtechno", "schranz", "techno"], "src": "DuckDuckGo", "d": "2026-11-23"}, {"t": "DMC World DJ Championships - FacebookDüne Bár - 11.11. DŪNE: OPEN DJ CONTEST Know how to turn ...Send this to your talented DJ friends! November 27th we’re ...Le Spot Club | Rouen - Facebook", "u": "https://www.facebook.com/dmcdjchamps/", "s": 7, "k": ["contest", "dj contest", "dmc", "schranz"], "src": "DuckDuckGo", "d": "2026-11-22"}, {"t": "Wimberghof pres. Ferox w/ Bitschu Batschu - 21.11.2026 ...", "u": "https://www.kronehit.szene1.at/event/wimberghof-pres-ferox-w-bitschu-batschu-wimberghof-voecklabruck-21-11-2026-eid486664", "s": 9, "k": ["contest", "dj contest", "hardgroove", "schranz", "techno"], "src": "DuckDuckGo", "d": "2026-11-22"}, {"t": "Mucho Electronic x Crazy but Real at Maloa in Barcelona", "u": "https://ma.to/event/mucho-electronic-x-crazy-but-real-13-nov-2026", "s": 9, "k": ["contest", "dj contest", "hard techno", "schranz", "techno"], "src": "DuckDuckGo", "d": "2026-11-21"}, {"t": "CLOVIS | #electromusic #bordeaux #housemusic | Instagram", "u": "https://www.instagram.com/reel/DezRRtquiMD/", "s": 9, "k": ["bordeaux", "contest", "dj contest", "hardtechno"], "src": "DuckDuckGo", "d": "2026-11-19"}, {"t": "Kostenlos: FUSE Open in San Francisco - 14 März", "u": "https://events.musicofourdesire.com/de/event/fbdj-fuse-open-decks-at-paris-75-party-san-francisco-united-states", "s": 9, "k": ["hard techno", "open decks", "paris", "techno"], "src": "DuckDuckGo", "d": "2026-11-18"}, {"t": "Open Decks at Paris 75 in San Francisco | MATO", "u": "https://ma.to/event/open-decks-paris-75-2026-10-25", "s": 9, "k": ["hard techno", "open decks", "paris", "techno"], "src": "DuckDuckGo", "d": "2026-11-18"}, {"t": "Paris Techno - FacebookHardtekk und Tekk Veranstaltungen - Party und Festival Liste ...France 2027: 59 Techno Festivals [Curated]DJ techno : la liste des DJ et producteurs en concertØUT: Saphire LeFleur, Kou2tatane, Avenir at Rex Club, Paris ...Phantom: Organïk - Phantom Paris - 31 décembre 2026", "u": "https://www.facebook.com/paristechno/", "s": 11, "k": ["contest", "dj contest", "france", "hard techno", "paris", "techno"], "src": "DuckDuckGo", "d": "2026-11-18"}, {"t": "Huci - NOISE LAB DJ CONTEST (schranz) by Gergely Huczka", "u": "https://soundcloud.com/gergely-huczka/huci-noise-lab-dj-contest", "s": 9, "k": ["contest", "dj contest", "dj-contest", "schranz"], "src": "DuckDuckGo", "d": "2026-11-18"}, {"t": "WATT Music Club | Plzen - Facebook", "u": "https://www.facebook.com/WattPlzen/", "s": 8, "k": ["contest", "dj contest", "hard techno", "techno"], "src": "DuckDuckGo", "d": "2026-11-15"}, {"t": "SINCITY COLLECTIF Upcoming Events · Shotgun", "u": "https://shotgun.live/en/venues/sincity-collectif", "s": 8, "k": ["hard bounce", "hard techno", "techno", "tremplin"], "src": "DuckDuckGo", "d": "2026-11-15"}, {"t": "RUI — PRESSURE SYSTEM - AT-DJ Contest #2 · 2026 - Mixcloud", "u": "https://www.mixcloud.com/ruifranciscosilva/rui-pressure-system-at-dj-hardtechno-contest-2-2026/", "s": 7, "k": ["contest", "dj contest", "hardtechno", "techno"], "src": "DuckDuckGo", "d": "2026-11-14"}, {"t": "DJ BAGOUS | je vous fais une passe d.. #dj #night #pov # ...", "u": "https://www.instagram.com/reel/De-AbufIK6M/", "s": 8, "k": ["contest", "dj contest", "hardtechno"], "src": "DuckDuckGo", "d": "2026-11-13"}, {"t": "RUI — PRESSURE SYSTEM - AT-DJ HardTechno Contest #2 · 2026", "u": "https://soundcloud.com/ruiberlin/rui-at-dj-contest-2026/sets", "s": 7, "k": ["contest", "dj-contest", "hardtechno"], "src": "DuckDuckGo", "d": "2026-11-13"}, {"t": "Zarka - Zamna DJ Contest 2026-11-10 - 1001Tracklists", "u": "https://www.1001tracklists.com/tracklist/2ngmjxt9/zarka-zamna-dj-contest-2026-11-10.html", "s": 5, "k": ["contest", "dj contest", "dj-contest", "techno"], "src": "DuckDuckGo", "d": "2026-11-13"}, {"t": "Nirvana Pub-Club | ️ B2B NIGHT ️ Vendredi 23.01.2026 ...", "u": "https://www.instagram.com/reel/DT0fGm6iGmt/", "s": 8, "k": ["contest", "dj contest", "hardtechno"], "src": "DuckDuckGo", "d": "2026-11-13"}, {"t": "Techno and Espresso - Open Deck Night bei Bourbon On Division ...", "u": "https://de.ra.co/events/2581927", "s": 7, "k": ["hard techno", "open deck", "techno"], "src": "DuckDuckGo", "d": "2026-11-13"}, {"t": "Le Spot Club | Rouen - Facebook", "u": "https://www.facebook.com/lespotclub/", "s": 10, "k": ["contest", "dj contest", "schranz"], "src": "DuckDuckGo", "d": "2026-11-13"}, {"t": "Águila - Old/New School Schranz Set FLAMA EMERGENCIA DJ CONTEST", "u": "https://soundcloud.com/aguila_schranz/schranz-set-flama-emergencia", "s": 9, "k": ["contest", "dj contest", "schranz"], "src": "DuckDuckGo", "d": "2026-11-13"}, {"t": "Klaudia Gawlas - DJ, producer - Partyflock⛓️ CADMIUM ⛓️ | Wir freuen uns am Samstag auf: @dj_tirox ...Paulo Fernandes: DJ CONTEST - 10 FINAL ARTISTS - FacebookTHE DJ CONTEST 2026 - Club04Wimberghof Vöcklabruck | Vöcklabruck - Facebook", "u": "https://partyflock.nl/artist/35962:Klaudia-Gawlas", "s": 9, "k": ["contest", "dj contest", "hardgroove", "hardtechno", "schranz", "techno"], "src": "DuckDuckGo", "d": "2026-11-13"}, {"t": "Águila - Old/New School Schranz Set FLAMA EMERGENCIA DJ CONTEST", "u": "https://soundcloud.com/aguila_schranz/schranz-set-flama-emergencia/sets", "s": 9, "k": ["contest", "dj contest", "schranz"], "src": "DuckDuckGo", "d": "2026-11-13"}, {"t": "SCHRANZ THROUGH YOUR VEINS | NOISE LAB DJ CONTEST", "u": "https://soundcloud.com/aaaabel/schranz-through-your-veins", "s": 9, "k": ["contest", "dj contest", "schranz"], "src": "DuckDuckGo", "d": "2026-11-13"}];
const IDF = ["paris","île-de-france","ile-de-france","idf","saint-denis","montreuil","pantin","ivry","aubervilliers"];
let etat = {fav:[], masques:[], vus:[]};
try { etat = Object.assign(etat, JSON.parse(localStorage.getItem("veille-etat") || "{}")); } catch(e) {}
const sauver = () => { try { localStorage.setItem("veille-etat", JSON.stringify(etat)); } catch(e) {} };
const nouveaux = new Set(DATA.map(d => d.u).filter(u => !etat.vus.includes(u)));
let filtre = "tous";

function bascule(liste, u){ const i = etat[liste].indexOf(u); i < 0 ? etat[liste].push(u) : etat[liste].splice(i,1); sauver(); rendre(); }

function rendre(){
  const L = document.getElementById("liste");
  const items = DATA.filter(d => {
    const masque = etat.masques.includes(d.u);
    if (filtre === "masques") return masque;
    if (masque) return false;
    if (filtre === "schranz") return d.k.includes("schranz");
    if (filtre === "paris") return d.k.some(k => IDF.includes(k));
    if (filtre === "fav") return etat.fav.includes(d.u);
    return true;
  });
  L.replaceChildren();
  if (!items.length){
    const v = document.createElement("div"); v.className = "vide";
    v.textContent = DATA.length ? "Rien dans ce filtre pour l’instant." : "Aucun contest repéré pour l’instant. La veille tourne chaque matin, reviens bientôt.";
    L.append(v); return;
  }
  for (const d of items){
    const c = document.createElement("div"); c.className = "c" + (etat.fav.includes(d.u) ? " fav" : "");
    if (nouveaux.has(d.u)) { const n = document.createElement("div"); n.className = "nouveau"; n.textContent = "NOUVEAU"; c.append(n); }
    const top = document.createElement("div"); top.className = "top";
    const s = document.createElement("div"); s.className = "score"; s.textContent = d.s;
    const box = document.createElement("div");
    const a = document.createElement("a"); a.href = d.u; a.target = "_blank"; a.rel = "noopener"; a.textContent = d.t;
    const m = document.createElement("div"); m.className = "meta";
    let host = ""; try { host = new URL(d.u).hostname.replace(/^www\./,""); } catch(e) {}
    m.textContent = host + " · repéré le " + d.d.split("-").reverse().join("/");
    box.append(a, m); top.append(s, box); c.append(top);
    const tags = document.createElement("div"); tags.className = "tags";
    for (const k of d.k){ const t = document.createElement("span"); if (k === "schranz") t.className = "s"; t.textContent = k; tags.append(t); }
    c.append(tags);
    const act = document.createElement("div"); act.className = "act";
    const bf = document.createElement("button"); bf.textContent = etat.fav.includes(d.u) ? "★ Favori" : "☆ Favori";
    if (etat.fav.includes(d.u)) bf.className = "on"; bf.onclick = () => bascule("fav", d.u);
    const bm = document.createElement("button"); bm.textContent = etat.masques.includes(d.u) ? "Réafficher" : "Masquer";
    bm.onclick = () => bascule("masques", d.u);
    act.append(bf, bm); c.append(act);
    L.append(c);
  }
}

document.getElementById("filtres").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filtre = b.dataset.f;
  document.querySelectorAll("#filtres button").forEach(x => x.classList.toggle("on", x === b));
  rendre();
});
rendre();
// Les éléments affichés ne seront plus marqués « nouveau » à la prochaine visite
etat.vus = Array.from(new Set(etat.vus.concat(DATA.map(d => d.u)))).slice(-1000); sauver();
</script>
</body>
</html>
